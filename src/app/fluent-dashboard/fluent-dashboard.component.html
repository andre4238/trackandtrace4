<app-fluent-header></app-fluent-header>

<div class="dashboard-layout">
  <app-fluent-sidebar (activeChange)="setActive($event)"></app-fluent-sidebar>

  <div class="dashboard-main">

    <!-- Dynamisch geladene Komponente -->
    <ng-container [ngSwitch]="activeButton">
      <app-box-new-project *ngSwitchCase="'dashboard'"></app-box-new-project>
      <app-support *ngSwitchCase="'Support'"></app-support>
      <app-customer-box *ngSwitchCase="'kunden'"></app-customer-box>
      <app-settings-box *ngSwitchCase="'settings'"></app-settings-box>

      <!-- Fallback optional -->
      <div *ngSwitchDefault class="p-4 text-muted">Bitte eine Ansicht auswählen.</div>
    </ng-container>

  </div>
</div>
