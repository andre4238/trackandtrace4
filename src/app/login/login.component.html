

<div class="fluent-login-wrapper">
  <div class="fluent-login-card">
    <h2 class="title">Login to Track & Trace</h2>


    <!-- Fehlermeldung global anzeigen -->
    <div *ngIf="errorMessage" class="fluent-error-box">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="loginWithEmail()">
      <!-- E-Mail -->
      <div class="form-group">
        <label for="email">E-Mail</label>
        <input type="email" id="email" formControlName="email" class="fluent-input" placeholder="E-Mail eingeben" />
        <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="input-error">
          <small *ngIf="email?.errors?.['required']">E-Mail erforderlich.</small>
          <small *ngIf="email?.errors?.['email']">Ungültige E-Mail-Adresse.</small>
        </div>
      </div>

      <!-- Passwort -->
      <div class="form-group">
        <label for="password">Passwort</label>
        <input type="password" id="password" formControlName="password" class="fluent-input" placeholder="Passwort eingeben" />
        <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="input-error">
          <small *ngIf="password?.errors?.['required']">Passwort erforderlich.</small>
        </div>
      </div>

      <!-- Login Button -->
      <button type="submit" class="fluent-button" [disabled]="loginForm.invalid">Login</button>
    </form>

    <!-- Links -->
    <div class="fluent-login-links">
      <a href="#">Passwort vergessen?</a> |
      <a href="#">Registrieren</a>
    </div>
  </div>
</div>
