<app-loginheader></app-loginheader>

<div class="login-container container mt-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
      <div class="card shadow-lg">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">🔑 Login</h2>

          <!-- Fehlermeldung global anzeigen -->
          <div *ngIf="errorMessage" class="alert alert-danger text-center">
            {{ errorMessage }}
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="loginWithEmail()">
            <!-- E-Mail-Eingabefeld -->
            <div class="form-group">
              <label for="email">E-Mail:</label>
              <input type="email" id="email" formControlName="email" class="form-control" placeholder="E-Mail eingeben">
              <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="text-danger">
                <small *ngIf="email?.errors?.['required']">E-Mail erforderlich.</small>
                <small *ngIf="email?.errors?.['email']">Ungültige E-Mail-Adresse.</small>
              </div>
            </div>

            <!-- Passwort-Eingabefeld -->
            <div class="form-group mt-3">
              <label for="password">Passwort:</label>
              <input type="password" id="password" formControlName="password" class="form-control" placeholder="Passwort eingeben">
              <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="text-danger">
                <small *ngIf="password?.errors?.['required']">Passwort erforderlich.</small>
              </div>
            </div>

            <!-- Login-Button -->
            <button type="submit" class="btn btn-primary btn-block mt-4" [disabled]="loginForm.invalid">
              Login
            </button>
          </form>

          <!-- Registrierung und Passwort vergessen -->
          <div class="text-center mt-3">
            <a href="#" class="text-primary">Passwort vergessen?</a> |
            <a href="#" class="text-primary">Registrieren</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
