<header class="fluent-header">
  <div class="header-left">
    <span class="app-title">Track & Trace</span>
  </div>

  <div class="header-right">
    <button class="header-button" aria-label="Benachrichtigungen">
      <img src="assets/bell.svg" alt="Benachrichtigung" />
    </button>

    <button class="header-button" aria-label="Einstellungen">
      <img src="assets/settings_unklicked.svg" alt="Einstellungen" />
    </button>

    <!-- ✅ Logout-Button mit click-handler -->
    <button class="header-button" aria-label="Logout" (click)="logout()">
      <img src="assets/exit.svg" alt="Abmelden" />
    </button>
  </div>
</header>
